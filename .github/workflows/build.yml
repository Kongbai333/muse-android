name: Android client
run-name: ${{ github.workflow }} / ${{ inputs.build_request_id || github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_request_id:
        description: Optional build identifier (display only)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Select signing mode
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request && -n "$KEYSTORE_BASE64" ]]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            install -d -m 700 "$RUNNER_TEMP/muse-signing"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muse-signing/preview.keystore"
            chmod 600 "$RUNNER_TEMP/muse-signing/preview.keystore"
            {
              echo "MUSE_ANDROID_KEYSTORE=$RUNNER_TEMP/muse-signing/preview.keystore"
              echo "MUSE_ANDROID_STORE_PASSWORD=$STORE_PASSWORD"
              echo "MUSE_ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "MUSE_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo 'variant=preview' >> "$GITHUB_OUTPUT"
            echo 'task=assemblePreview' >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo '::error::Tagged releases require the four ANDROID signing secrets.'
              exit 1
            fi
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
            echo 'task=assembleDebug' >> "$GITHUB_OUTPUT"
          fi
      - name: Build, lint and prepare Java contracts
        env:
          BUILD_TASK: ${{ steps.signing.outputs.task }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon ":app:$BUILD_TASK" :app:lintDebug :app:writeContractCheckClasspath --stacktrace
      - name: Java and floating-switch contracts
        shell: pwsh
        run: ./scripts/check-contracts.ps1
      - name: Browser adapter contracts
        run: |
          node --test checks/check-observer.cjs
          node --test checks/check-card-refresh-integration.cjs
          node --test checks/check-app-update-integration.cjs
          node checks/check-app-update-ui.cjs
          node --test checks/check-account-transfer-integration.cjs
          node checks/check-account-transfer-store.cjs
          node checks/check-account-transfer-json.cjs
          node checks/check-studio.cjs
          node checks/check-original-media.cjs
          node checks/check-reference-upload.cjs
      - name: Verify the APK signature
        env:
          BUILD_VARIANT: ${{ steps.signing.outputs.variant }}
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "app/build/outputs/apk/$BUILD_VARIANT/app-$BUILD_VARIANT.apk"'
      - name: Package the APK
        shell: pwsh
        env:
          BUILD_VARIANT: ${{ steps.signing.outputs.variant }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/package-android.ps1 -Variant $env:BUILD_VARIANT -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muse-android-${{ steps.signing.outputs.variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/muse-signing/preview.keystore"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muse-android-preview
          path: dist
      - name: Publish the versioned download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.sha256 --verify-tag \
            --title "Muse Android $RELEASE_TAG" --generate-notes
